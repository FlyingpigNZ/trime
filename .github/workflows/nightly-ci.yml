name: Nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 / GMT+8 0:00, daily

env:
  CI_NAME: Nightly CI
jobs:
  build:
    if: ${{ github.repository == 'osfans/trime' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        # Keep the cmake version in sync with Versions.DEFAULT_CMAKE instead
        # of maintaining it in two places.
        run: |
          CMAKE_VERSION=$(grep -oP 'DEFAULT_CMAKE = "\K[^"]+' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;$CMAKE_VERSION"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user pyyaml || python3 -m pip install --user --break-system-packages pyyaml

      - name: Calculate JNI cache hash
        id: cache-hash
        # A plain script: asking Gradle for this key cost ~95s per job (wrapper
        # download, build-logic compile, AGP installing the NDK). The script
        # reproduces the former Gradle key byte-for-byte, so the existing
        # "app/prebuilt" cache entries still hit.
        run: python3 script/native-cache-hash.py

      - name: Fetch JNI cache
        uses: actions/cache@v5
        id: jni-cache
        with:
          path: "app/prebuilt"
          # v2: entries written before the switch to stripped libraries hold
          # merged (unstripped) ones and must not be reused.
          key: ${{ runner.os }}-trime-jni-release-v2-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Trime
        run: make release

      - name: Verify native libs are stripped
        # A cache-hit build packages `app/prebuilt` without configuring a CMake
        # build, so a missing strip tool would ship the cached libraries
        # verbatim (they are 4-7x larger unstripped, ~3x the APK size). Loud,
        # because the size regression is otherwise invisible in the release.
        run: bash script/check-native-libs-stripped.sh app/build/outputs/apk/release/*.apk

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        # Stripped, not merged: while `app/prebuilt` exists the build packages it as
        # jniLibs and never configures CMake, so on a cache hit the stripping AGP
        # would do is skipped when no strip tool is available — the unstripped
        # libraries then land in the APK as-is.
        run: cp -R app/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib app/prebuilt

      - name: Create Nightly release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nightly
          prerelease: true
          title: "Nightly Build"
          files: |
            app/build/outputs/apk/release/*.apk
