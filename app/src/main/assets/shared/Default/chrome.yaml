# Tongwenfeng-specific chrome (preedit / window / tool_bar).
# Generated from app/src/main/assets/shared/tongwenfeng.trime.yaml
preedit:
  horizontal_padding: 8
  top_end_radius: 4
  foreground:
    font_size: 16
window:
  insets:
    vertical: 4
    horizontal: 4
  item_padding:
    horizontal: 4
  foreground:
    label_font_size: 20
    text_font_size: 20
    comment_font_size: 16
tool_bar:
  button_spacing: 5
  button_font: iconfont.ttf
  back_style: ic@arrow-left
  primary_button:
    background:
      type: circle
      corner_radius: 10
      normal: 0x00
      highlight: hilited_candidate_button_color
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: ic@dots_horizontal
      normal: candidate_text_color
      padding: 10
    action: menu_keyboard
    long_press_action: Settings
  hide_button: &id001
    foreground:
      style: ic@keyboard_close
      normal: candidate_text_color
    action: Hide
  emoji_button: &id002
    foreground:
      style: ic@emoticon
    action: liquid_keyboard_emoji
  clipboard_button: &id003
    foreground:
      style: ic@clipboard
    action: clipboard_window
  edit_button: &id004
    foreground:
      style: ic@cursor_text
    action: Keyboard_editor
  ascii_mode_button: &id005
    foreground:
      option_styles:
      - 中
      - En
      font_size: 18
      padding: 10
    action: Mode_switch
  full_shape_button: &id006
    foreground:
      option_styles:
      - ic@moon_full
      - ic@moon_new
    action: Zenkaku_Hankaku
  buttons:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
