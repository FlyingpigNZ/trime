  - func
  - edit
  candidate_use_cursor: true
  candidate_view_height: 18
  candidate_padding: 6
  candidate_spacing: 0.5
  candidate_font: han.ttf
  candidate_text_size: 18
  comment_on_top: true
  comment_height: 18
  comment_font: comment.ttf
  comment_text_size: 12
  proximity_correction: true
  vertical_correction: -5
  horizontal_gap: 0
  vertical_gap: 0
  key_height: 50
  key_width: 12
  round_corner: 6
  shadow_radius: 0.9
  key_font: symbol.ttf
  latin_font: latin.ttf
  hanb_font: hanb.ttf
  key_text_size: 20
  key_long_text_size: 16
  symbol_font: symbol.ttf
  symbol_text_size: 10
  preview_height: 44
  preview_offset: -10
  preview_font: latin.ttf
  preview_text_size: 36
  label_font: label.ttf
  label_text_size: 19
  text_font: latin.ttf
  text_size: 16
  window:
  - start: ' '
    composition: '%s'
    end: ' '
    letter_spacing: 0
  - start: '

      '
    label: '%s.'
    candidate: '%s'
    comment: ' %s'
    end: ''
    sep: ' '
  layout:
    position: fixed
    movable: false
    real_margin: 0
    spacing: -1
    margin_x: 5
    margin_y: 1
    border: 0
    round_corner: 2
    elevation: 2
    alpha: 255
    all_phrases: false
    min_length: 8
    max_length: 15
    sticky_lines: 0
    max_entries: 2
    max_width: 330
    max_height: 400
    min_width: 32
    min_height: 0
    line_spacing: 0
    line_spacing_multiplier: 1.1
liquid_keyboard:
  author: amzxyz
  row: 6
  row_land: 4
  key_height: 40
  key_height_land: 40
  single_width: 40
  vertical_gap: 0
  margin_x: 3
  fixed_key_bar:
    position: right
    keys:
    - liquid_keyboard_exit
    - space1
    - BackSpace
    - Return1
    - liquid_keyboard_clipboard
    - Menu1
  keyboards:
  - clipboard
  - history
  - emoji
  - math
  - ascii
  - cn
