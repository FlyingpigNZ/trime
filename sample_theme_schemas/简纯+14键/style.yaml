  - ywz61
  - ywz62
  - default
  - rime_ice
  - double_pinyin_flypy
  - 14jian
  - letter
  - letter_14jian
  - number
  - func
  - edit
  candidate_use_cursor: true
  candidate_view_height: 28
  candidate_padding: 5
  candidate_spacing: 0.0
  candidate_font: han.ttf
  candidate_text_size: 18
  comment_on_top: true
  comment_height: 12
  comment_font: comment.ttf
  comment_text_size: 10
  proximity_correction: true
  vertical_correction: -5
  horizontal_gap: 0
  vertical_gap: 0
  key_height: 50
  key_width: 12
  round_corner: 6
  shadow_radius: 0.9
  key_font: symbol.ttf
  latin_font: latin.ttf
  hanb_font: hanb.ttf
  key_text_size: 20
  key_long_text_size: 16
  symbol_font: symbol.ttf
  symbol_text_size: 10
  preview_height: 44
  preview_offset: -10
  preview_font: latin.ttf
  preview_text_size: 36
  label_font: label.ttf
  label_text_size: 19
  text_font: latin.ttf
  text_size: 16
  window:
  - start: ' '
    composition: '%s'
    end: ' '
    letter_spacing: 0
  - start: '

      '
    label: '%s.'
    candidate: '%s'
    comment: ' %s'
    end: ''
    sep: ' '
  layout:
    position: fixed
    movable: false
    real_margin: 0
    spacing: -1
    margin_x: 5
    margin_y: 1
    border: 0
    round_corner: 2
    elevation: 2
    alpha: 255
    all_phrases: false
    min_length: 8
    max_length: 15
    sticky_lines: 0
    max_entries: 2
    max_width: 330
    max_height: 400
    min_width: 32
    min_height: 0
    line_spacing: 0
    line_spacing_multiplier: 1.1
