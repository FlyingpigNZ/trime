style:
  color_scheme: default
  keyboard_height: 240
  keyboard_height_land: 200
  horizontal: true
  keyboard_padding: 3
  keyboard_padding_left: 0
  keyboard_padding_right: 40
  keyboard_padding_bottom: -6
  keyboard_padding_land: 0
  keyboard_padding_land_bottom: 0
  reset_ascii_mode: false
  speech_opencc_config: t2s.json
  auto_caps: false
  latin_locale: en_US
  locale: zh_CN
  background_dim_amount: 0.5
  background_folder: /
  keyboards:
  - .default
  - symbols
  - sym112
  - sym121
  - sym122
  - sym151
  - sym152
  - sym153
  - sym154
  - sym155
  - sym161
