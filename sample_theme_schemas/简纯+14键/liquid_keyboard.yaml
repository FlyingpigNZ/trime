liquid_keyboard:
  author: amzxyz
  row: 6
  row_land: 4
  key_height: 40
  key_height_land: 40
  single_width: 40
  vertical_gap: 0
  margin_x: 3
  fixed_key_bar:
    position: right
    keys:
    - liquid_keyboard_exit
    - space1
    - BackSpace
    - Return1
    - liquid_keyboard_clipboard
    - Menu1
  keyboards:
  - clipboard
  - history
  - emoji
  - math
  - ascii
  - cn
  - unit
  - list
  - symbol
