# 简纯+14键 self-contained IME package manifest
name: 简纯+14键
author: amzxyz
version: '1.0'
schema_id: 14jian
default_keyboard: 14jian
components:
- schema:
    file: 14jian.schema.yaml
- schema:
    file: double_pinyin_flypy.schema.yaml
- schema:
    file: rime_ice.schema.yaml
- keyboard:
    file: keyboard.yaml
- behavior:
    file: behavior.yaml
- color:
    file: color.yaml
- style:
    file: style.yaml
- style:
    file: liquid_keyboard.yaml
- style:
    file: chrome.yaml
# Rime files required by the full rime-ice based schema. They are stored under
