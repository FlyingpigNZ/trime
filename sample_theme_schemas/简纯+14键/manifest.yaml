- rime/cn_dicts/ext.dict.yaml
- rime/cn_dicts/tencent.dict.yaml
- rime/cn_dicts/others.dict.yaml
- rime/en_dicts/en.dict.yaml
- rime/en_dicts/en_ext.dict.yaml
- rime/en_dicts/cn_en_flypy.txt
- rime/custom_phrase_double.txt
- rime/lua/autocap_filter.lua
