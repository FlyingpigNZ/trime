# Tongwenfeng style and liquid keyboard
# Generated from app/src/main/assets/shared/tongwenfeng.trime.yaml
style:
  auto_caps: false
  candidate_font: han.ttf
  candidate_padding: 5
  candidate_spacing: 0.0
  candidate_text_size: 18
  candidate_text_vertical_bias: 1.0
  candidate_view_height: 28
  comment_font: comment.ttf
  comment_height: 12
  comment_position: right
  comment_vertical_bias: 0.0
  comment_text_size: 10
  hanb_font: hanb.ttf
  horizontal_gap: 4
  key_font: symbol.ttf
  key_height: 48
  key_long_text_size: 16
  key_text_size: 24
  key_width: 10.0
  label_text_size: 22
  label_font: label.ttf
  latin_font: latin.ttf
  keyboard_height: 250
  keyboard_height_land: 200
  popup_font: latin.ttf
  popup_width: 38
  popup_height: 48
  popup_bottom_margin: 68
  popup_key_height: 48
  popup_text_size: 23
  reset_ascii_mode_on_focus_change: false
  round_corner: 6
  shadow_radius: 0.0
  symbol_font: symbol.ttf
  symbol_text_size: 10
  text_font: latin.ttf
  vertical_gap: 12
  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: Enter
liquid_keyboard:
  author: tumuyan
  row: 6
  row_land: 5
  key_height: 40
  key_height_land: 40
  single_width: 60
  vertical_gap: 8
  margin_x: 5
  fixed_key_bar:
    position: bottom
    keys:
    - liquid_keyboard_exit
    - space1
    - BackSpace
    - Return2
    - clipboard_window
    - liquid_keyboard_tabs
  keyboards:
  - emoji
  - math
  - ascii
  - cn
  - history
  - symbollist
  - list
  - ids
  - symbol
  - tabs
  - pinyin
  - script_symbols
  - jp
  - grease
  - rusa
  - korea
  - lation
  - yinbiao
  - unit
  - yanwenzi
  - combing
  - emoji_full
