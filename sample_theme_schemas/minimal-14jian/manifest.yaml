# Minimal tier-3 schema-layout package manifest.
#
# This is the reference format for shipping a Rime schema together with its
# custom keyboard layouts. The app can unpack the zip, compile the schema
# through Rime, and register the layout file(s) into the schema tier.
schema_id: 14jian
name: 小鹤双拼14键
version: "0.1"
schema_file: 14jian.schema.yaml
# The schema-specific layout is self-contained for everything the 14jian
# keyboards reference that is not already in the shipped standard catalog.
layout_files:
  - 14jian.layout.yaml
# Optional: the keyboard used when this schema becomes active.
default_keyboard: 14jian
# Optional resources referenced by the layouts, e.g. background images.
# Paths are relative to the package root and are unpacked with the layout.
resources:
  # - backgrounds/14jian.png
  # - backgrounds/14jian.night.png
