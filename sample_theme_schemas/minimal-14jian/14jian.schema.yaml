# Minimal Rime schema for the 14-key double-pinyin reference.
#
# Stripped from sample_theme_schemas/14jian.schema.yaml:
# - removed rime-ice Lua processors/translators/filters
# - removed external dependencies (melt_eng, radical_pinyin)
# - removed custom phrase / date / lunar / unicode / calculator extras
# - kept only the core engine pipeline needed to compile and type with Rime

schema:
  schema_id: 14jian
  name: 小鹤双拼14键
  version: "0.1"
  description: Minimal reference schema paired with 14jian.layout.yaml.

switches:
  - name: ascii_mode
  - name: ascii_punct
  - name: full_shape
  - name: simplification

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra: []

translator:
  dictionary: 14jian
  preedit_format: []
