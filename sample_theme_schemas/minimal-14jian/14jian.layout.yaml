# Minimal tier-3 layout for the 14jian schema.
#
# Stripped from sample_theme_schemas/简纯+14键.trime.yaml:
# - removed full theme decoration (style/preedit/window/colors/liquid keyboard)
# - removed the `conf` indirection and `__patch` mechanics for this reference
# - kept only the schema-specific preset_keys and the 14jian/letter_14jian
#   keyboards, plus explicit references to standard tier-1 components.
#
# When loaded as a theme this file is intentionally minimal; the normal runtime
# path will merge it on top of a decoration theme via ThemeResolver.

name: 14键布局
author: amzxyz
style: {}

use_standard_preset_keys: true
standard_keyboards: [default, letter, number, symbols]
standard_color_schemes: [default]

preset_keys:
  # 顶部数字排映射
  num1: {label: 1, send: 1}
  num2: {label: 2, send: 2}
  num3: {label: 3, send: 3}
  num4: {label: 4, send: 4}
  num5: {label: 5, send: 5}
  num6: {label: 6, send: 6}
  num7: {label: 7, send: 7}
  num8: {label: 8, send: 8}
  num9: {label: 9, send: 9}
  num0: {label: 0, send: 0}

  # 14键共键单发
  14keyqw: {label: " Q W ", send: "q"}
  14keyer: {label: "E R", send: "e"}
  14keyty: {label: "T Y", send: "t"}
  14keyui: {label: "U I", send: "u"}
  14keyop: {label: "O P", send: "o"}
  14keyas: {label: "A S", send: "a"}
  14keydf: {label: "D F", send: "d"}
  14keygh: {label: "G H", send: "g"}
  14keyjk: {label: "J K", send: "j"}
  14keyl: {label: " L ", send: "l"}
  14keyzx: {label: "Z X", send: "z"}
  14keycv: {label: "C V", send: "c"}
  14keybn: {label: "B N", send: "b"}
  14keym: {label: " M ", send: "m"}

  # 键盘互相跳转
  Keyboard_14jian: {label: 中, send: Eisu_toggle, select: letter_14jian}
  Keyboard_letter_14jian: {label: 英, send: Eisu_toggle, select: 14jian}
  Back14: {label: 返回, send: Eisu_toggle, select: 14jian}
  Back14en: {label: 返回, send: Eisu_toggle, select: letter_14jian}
  Keyboard_symbols: {label: "۞", send: Eisu_toggle, select: symbols}
  Keyboard_number: {label: "123", send: Eisu_toggle, select: number}
  BS: {label: "⌫", repeatable: true, send: BackSpace}

preset_keyboards:
  14jian:
    name: 14键
    author: amzxyz
    ascii_mode: 0
    lock: true
    ascii_keyboard: letter_14jian
    label_transform: uppercase
    width: 10
    height: 48
    keys:
      # 数字行
      - {click: num1}
      - {click: num2}
      - {click: num3}
      - {click: num4}
      - {click: num5}
      - {click: num6}
      - {click: num7}
      - {click: num8}
      - {click: num9}
      - {click: num0}
      # 第 1 行
      - {click: 14keyqw}
      - {click: 14keyer}
      - {click: 14keyty}
      - {click: 14keyui}
      - {click: 14keyop}
      # 第 2 行
      - {click: 14keyas}
      - {click: 14keydf}
      - {click: 14keygh}
      - {click: 14keyjk}
      - {click: 14keyl}
      # 第 3 行
      - {click: 14keyzx}
      - {click: 14keycv}
      - {click: 14keybn}
      - {click: 14keym}
      # 第 4 行
      - {click: Keyboard_symbols}
      - {click: Keyboard_number}
      - {click: BS, width: 2}
      - {click: space, width: 4}
      - {click: Return}

  letter_14jian:
    ascii_mode: 1
    lock: true
    reset_ascii_mode: false
    __include: /preset_keyboards/default
