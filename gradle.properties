# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# Reuse task outputs across builds. CI restores ~/.gradle/caches between runs,
# which includes the local build cache directory, so repeated jobs skip
# recompiling build-logic and tasks whose inputs did not change.
org.gradle.caching=true

# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true
